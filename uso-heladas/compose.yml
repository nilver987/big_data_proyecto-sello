name: lambda26-uso-heladas

services:
  uso-heladas:
    build: .
    container_name: lambda26-uso-heladas
    env_file:
      - ../pyspark/sesiones/u1/.env
    volumes:
      - ./app:/app
    working_dir: /app
    command: sleep infinity
    networks:
      - lambda26-kafka-net

networks:
  lambda26-kafka-net:
    external: true
    name: lambda26-kafka-net
