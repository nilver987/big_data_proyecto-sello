name: Publicar sitio MkDocs (Proyecto Sello)

on:
  push:
    branches:
      - main
    paths:
      - "sitio-proyecto/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7" "pymdown-extensions==12.3"

      - name: Publicar en GitHub Pages
        run: mkdocs gh-deploy --force -f sitio-proyecto/mkdocs.yml