site_name: Proyecto Sello
site_description: Brief Técnico Analítico — Anticipación de heladas en Juliaca
site_author: Salcca Aquino, Nilver
repo_url: https://github.com/nilver987/big_data_proyecto-sello
repo_name: nilver987/big_data_proyecto-sello
docs_dir: docs

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
    code: Roboto Mono
  icon:
    logo: material/snowflake
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      toc_depth: 3

nav:
  - Inicio: index.md
  - Datos del equipo: equipo.md
  - Dominio del proyecto: dominio.md
  - Dimensión de análisis:
      - Tabla de asignación: dimensiones/asignacion.md
      - "❄️ Heladas": dimensiones/heladas.md
  - Alcance del proyecto: alcance.md
  - Resultados técnicos:
      - "❄️ Heladas · Unidad I": resultados/heladas/01_heladas_nilver.md
  - Unidad 2:
      - Resumen: unidad2/index.md
      - "1. Arquitectura y contrato": unidad2/arquitectura.md
      - "2. Ingesta con Kafka": unidad2/ingesta-kafka.md
      - "3. Streaming con Spark": unidad2/streaming-spark.md
      - "4. Observabilidad y alertas": unidad2/observabilidad.md
      - "5. Costos y escalado": unidad2/costos-escalado.md
      - "6. BI/ML en Grafana": unidad2/bi-ml.md
      - "7. Tableros de Grafana": unidad2/tableros.md
      - "8. Series de tiempo": unidad2/series-tiempo.md
      - "9. ¿Hasta cuántas horas?": unidad2/multihorizonte.md
      - "10. Hallazgos y reflexión": unidad2/hallazgos.md
      - "11. Sustentación": unidad2/sustentacion.md
  - Unidad 3:
      - Resumen: unidad3/index.md
      - "1. Instalación y ejecución": unidad3/ejecucion.md
      - "2. Integración y DataOps": unidad3/integracion-dataops.md
      - "3. Hardening y revisión técnica": unidad3/hardening.md
      - "4. Sustentación y trazabilidad": unidad3/sustentacion.md
